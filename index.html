<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APK Scanner Live 🍻</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 15px;
            background-color: #f5f5f7;
            color: #1d1d1f;
            text-align: center;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .setup-section {
            background: #f2f2f7;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
        .setup-section label {
            display: block;
            font-weight: 600;
            margin-top: 8px;
            font-size: 13px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .quick-buttons {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        .quick-btn {
            flex: 1;
            background: #e5e5ea;
            border: none;
            padding: 6px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .quick-btn:active { background: #d1d1d6; }
        
        /* Kamerarutan */
        .video-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Sikte för prislappen */
        .scanner-laser {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 2px;
            background: red;
            box-shadow: 0 0 8px red;
            opacity: 0.7;
        }

        .result-box {
            padding: 15px;
            background-color: #1c1c1e;
            color: white;
            border-radius: 12px;
        }
        .apk-value {
            font-size: 48px;
            font-weight: 900;
            color: #30d158;
            margin: 5px 0;
        }
        .status-text {
            font-size: 14px;
            color: #aeaeae;
        }
    </style>
    <!-- Vi använder Tesseract för live-avläsning -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div class="container">
    <h2>APK Live-Scanner 🍻</h2>
    
    <div class="setup-section">
        <label>1. Volym (ml):</label>
        <input type="number" id="volume" value="500">
        <div class="quick-buttons">
            <button class="quick-btn" onclick="setVol(330)">33 cl</button>
            <button class="quick-btn" onclick="setVol(440)">44 cl</button>
            <button class="quick-btn" onclick="setVol(500)">50 cl</button>
            <button class="quick-btn" onclick="setVol(750)">75 cl</button>
        </div>

        <label>2. Alkoholhalt (%):</label>
        <input type="number" id="abv" value="5.2" step="0.1">
        <div class="quick-buttons">
            <button class="quick-btn" onclick="setAbv(5.2)">5.2%</button>
            <button class="quick-btn" onclick="setAbv(7.0)">7.0%</button>
            <button class="quick-btn" onclick="setAbv(12.0)">12%</button>
            <button class="quick-btn" onclick="setAbv(40.0)">40%</button>
        </div>
    </div>

    <!-- Live Kamerafönster -->
    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="scanner-laser"></div>
    </div>

    <div class="result-box">
        <div class="status-text" id="status">Startar kameran... Vänligen ge tillåtelse.</div>
        <div class="apk-value" id="apk-result">0.00</div>
        <div style="font-size: 13px; color: #aeaeae;">Alkohol Per Krona (APK)</div>
        <hr style="border: 0; border-top: 1px solid #3a3a3c; margin: 10px 0;">
        <p style="font-size: 13px; color: #aeaeae; margin: 0;">
            Avläst pris på hyllan: <span id="detected-price" style="color:white; font-weight:bold;">-</span> kr
        </p>
    </div>
</div>

<!-- Dold rityta för att stjäla bildrutor från videon -->
<canvas id="hidden-canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hidden-canvas');
    const statusText = document.getElementById('status');
    const apkResult = document.getElementById('apk-result');
    const detectedPriceText = document.getElementById('detected-price');

    function setVol(ml) { document.getElementById('volume').value = ml; }
    function setAbv(pct) { document.getElementById('abv').value = pct; }

    let worker = null;
    let isScanning = false;

    async function initKamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: 'environment' } },
                audio: false
            });
            video.srcObject = stream;
            statusText.innerText = 'Laddar AI-motor...';
            video.addEventListener('loadedmetadata', () => initAI(), { once: true });
        } catch (err) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                statusText.innerText = 'Laddar AI-motor...';
                video.addEventListener('loadedmetadata', () => initAI(), { once: true });
            } catch (e) {
                statusText.innerText = 'Kameran blockeras. Kontrollera Safari-inställningarna.';
                console.error(e);
            }
        }
    }

    async function initAI() {
        try {
            if (!window.Tesseract) {
                throw new Error('Tesseract.js kunde inte laddas.');
            }

            worker = await Tesseract.createWorker('swe');
            statusText.innerText = 'Håll kameran stadigt mot priset...';
            isScanning = true;
            loopScanning();
        } catch (err) {
            statusText.innerText = 'Kunde inte starta AI-motorn.';
            console.error(err);
        }
    }

    async function loopScanning() {
        if (!isScanning || video.readyState < 2) return;

        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const width = video.videoWidth || 640;
        const height = video.videoHeight || 480;
        canvas.width = 400;
        canvas.height = Math.round((height / width) * canvas.width);

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

        try {
            const { data: { text } } = await worker.recognize(dataUrl);
            tolkaText(text);
        } catch (e) {
            console.log('Scan-miss, försöker igen...');
        }

        setTimeout(loopScanning, 1500);
    }

    function extractPriceCandidates(text) {
        const lines = String(text || '').split(/\n+/);
        const candidates = [];

        for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;

            const lower = trimmed.toLowerCase();
            const hasCurrencyContext = /kr|sek|kronor|pris|price|cost|total|per/i.test(lower);

            const matches = [
                ...trimmed.matchAll(/\d{1,3}(?:[.,:]\d{2})/g),
                ...(hasCurrencyContext ? trimmed.matchAll(/\b\d{1,3}\b/g) : [])
            ];

            for (const match of matches) {
                const raw = match[0];
                const value = parseFloat(raw.replace(',', '.').replace(':', '.'));

                if (!Number.isFinite(value)) continue;
                if (value < 8 || value >= 400) continue;

                candidates.push(value);
            }
        }

        return candidates;
    }

    function tolkaText(text) {
        console.log('Live text:', text);

        const candidates = extractPriceCandidates(text);
        if (candidates.length === 0) return;

        const counts = new Map();
        for (const value of candidates) {
            const key = Number(value.toFixed(2));
            counts.set(key, (counts.get(key) || 0) + 1);
        }

        const bestPrice = [...counts.entries()]
            .sort((a, b) => {
                if (b[1] !== a[1]) return b[1] - a[1];
                return Math.abs(a[0] - 39) - Math.abs(b[0] - 39);
            })[0][0];

        detectedPriceText.innerText = bestPrice.toFixed(2);

        const volym = parseFloat(document.getElementById('volume').value);
        const alkohol = parseFloat(document.getElementById('abv').value);

        if (!Number.isFinite(volym) || !Number.isFinite(alkohol) || volym <= 0 || alkohol <= 0) {
            return;
        }

        const renAlkohol = volym * (alkohol / 100);
        const apk = renAlkohol / bestPrice;

        apkResult.innerText = apk.toFixed(2);
        statusText.innerText = 'Pris avläst!';
    }

    window.addEventListener('DOMContentLoaded', initKamera);
</script>

</body>
</html>
